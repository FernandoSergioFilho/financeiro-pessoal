name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/planilha-controle-financeiro-f0xyoz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois envios acontecerem perto, o mais novo vence — mas sem cortar uma
# publicação já em andamento pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Roda antes de publicar de propósito: uma versão quebrada não chega ao ar.
      - name: Testes
        run: npm test

      - name: Checagem de tipos
        run: npm run typecheck

      # A configuração do Supabase vem do .env.production versionado, e não de
      # secrets. A chave `anon` é entregue ao navegador de todo visitante, então
      # escondê-la num secret não protegeria nada — quem protege os dados são as
      # políticas de acesso em supabase/schema.sql.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
