name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/planilha-controle-financeiro-f0xyoz]
  workflow_dispatch:

# Publicar é um push na branch `gh-pages`, então basta poder escrever no
# repositório. As actions oficiais de Pages exigiriam que alguém ligasse o
# Pages nas configurações antes: elas pedem permissão de administração, que o
# token do workflow não tem, e falham com "Resource not accessible by
# integration". Pela branch, o GitHub liga o Pages sozinho.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Antes de publicar, de propósito: uma versão quebrada não chega ao ar.
      - name: Testes
        run: npm test

      - name: Checagem de tipos
        run: npm run typecheck

      # A configuração do Supabase vem do .env.production versionado, e não de
      # secrets: a chave `anon` é entregue ao navegador de todo visitante, então
      # escondê-la num secret não protegeria nada — quem protege os dados são as
      # políticas de acesso em supabase/schema.sql.
      - name: Build
        run: npm run build

      - name: Publicar
        run: |
          cd dist
          # Sem isto o Pages passa o conteúdo pelo Jekyll, que ignora arquivos
          # e pastas começados por underscore.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
