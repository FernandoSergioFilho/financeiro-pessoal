name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/planilha-controle-financeiro-f0xyoz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois envios acontecerem perto, o mais novo vence — mas sem cortar uma
# publicação já em andamento pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Roda antes de publicar de propósito: uma versão quebrada não chega ao ar.
      - name: Testes
        run: npm test

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Enquanto os segredos não existirem, estas variáveis chegam vazias
          # e o aplicativo funciona em modo local, como hoje.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
