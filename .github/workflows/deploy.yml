name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/planilha-controle-financeiro-f0xyoz]
  workflow_dispatch:

# Publicar é um push na branch `gh-pages`, então basta poder escrever no
# repositório. As actions oficiais de Pages exigiriam que alguém ligasse o
# Pages nas configurações antes: elas pedem permissão de administração, que o
# token do workflow não tem, e falham com "Resource not accessible by
# integration". Pela branch, o GitHub liga o Pages sozinho.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Antes de publicar, de propósito: uma versão quebrada não chega ao ar.
      - name: Testes
        run: npm test

      - name: Checagem de tipos
        run: npm run typecheck

      # As simulações rodam o app de verdade num Chromium, com a carteira de
      # `carteiraExemplo` — duas pessoas, três contas, quatro cartões. Existem
      # porque os defeitos que mais doeram (a tela sumindo ao apagar a data, a
      # conta que não deixava apagar) passavam pelos testes de unidade e só
      # apareciam na tela. Uma versão que não sobrevive a elas não vai ao ar.
      - name: Navegador
        run: |
          # Instalar o Chromium tem duas partes: baixar o navegador do CDN do
          # Playwright, e instalar fontes e bibliotecas pelo apt do Ubuntu. A
          # segunda já derrubou duas publicações seguidas sem resolver
          # archive.ubuntu.com — e o que ela baixa, nessas horas, é uma lista
          # de FONTES: japonesa, tailandesa, chinesa, cirílica. Nenhuma delas
          # faz falta para um app em português.
          #
          # Então o apt deixa de mandar na publicação: duas tentativas com
          # ele, e se não der, baixa só o navegador, que não passa por lá.
          instalou=
          for tentativa in 1 2; do
            if npx playwright install --with-deps chromium; then instalou=sim; break; fi
            echo "apt do runner falhou (tentativa $tentativa); esperando"
            sleep $((tentativa * 20))
          done
          if [ -z "$instalou" ]; then
            echo "Seguindo sem as dependências de sistema: só o navegador."
            npx playwright install chromium
          fi
          # E conferir que ele ABRE, antes de qualquer sonda. Se faltar mesmo
          # alguma biblioteca, o erro aparece aqui, dizendo o que falta — e não
          # como seis sondas estourando o tempo sem explicar por quê.
          node -e "require('playwright').chromium.launch().then((b) => b.close()).then(() => console.log('Chromium abre.'))"
          npm run build:single
          npm run test:telas
          npm run test:simulacao
          npm run test:dialogos
          npm run test:chave
          npm run test:recortes
          npm run test:ditado
          npm run test:novidades
          npm run build
          npm run test:dois

      # A configuração do Supabase vem do .env.production versionado, e não de
      # secrets: a chave `anon` é entregue ao navegador de todo visitante, então
      # escondê-la num secret não protegeria nada — quem protege os dados são as
      # políticas de acesso em supabase/schema.sql.
      - name: Build
        run: npm run build

      - name: Publicar
        run: |
          cd dist
          # Sem isto o Pages passa o conteúdo pelo Jekyll, que ignora arquivos
          # e pastas começados por underscore.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
